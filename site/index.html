<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus — Sign up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>Create an account</h1>
  <form id="signup-form">
    <label for="email">Email</label>
    <input id="email" type="email" value="you@example.com">
    <button type="submit">Sign up</button>
  </form>
  <div class="result result-success" id="success-msg">&#10003; Signed up successfully!</div>
  <div class="result result-error" id="error-msg">&#10007; That email is already registered.</div>
</div>
<script src="script.js"></script>
</body>
</html>
